<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="55%" stop-color="#15121a"/>
      <stop offset="100%" stop-color="#1a0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff2d3a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff2d3a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff2d3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5b5b"/>
      <stop offset="100%" stop-color="#c9101e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ee0ff"/>
      <stop offset="100%" stop-color="#0a6a8c"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffdede"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- faint pixel grid backdrop -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- scan lines sweeping right side, evoking video streaming -->
  <g opacity="0.5">
    <line x1="760" y1="40" x2="1140" y2="40" stroke="#ff3b3b" stroke-width="1.5"/>
    <line x1="800" y1="70" x2="1140" y2="70" stroke="#ff3b3b" stroke-width="1"/>
    <line x1="740" y1="290" x2="1140" y2="290" stroke="#3ee0ff" stroke-width="1.5"/>
    <line x1="780" y1="315" x2="1140" y2="315" stroke="#3ee0ff" stroke-width="1"/>
  </g>

  <!-- large play button cluster on right -->
  <g transform="translate(955,175)">
    <circle cx="0" cy="0" r="118" fill="#000000" opacity="0.35"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#ff3b3b" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="88" fill="url(#playGrad)"/>
    <polygon points="-25,-42 -25,42 48,0" fill="#0b0b0f"/>
  </g>

  <!-- orbiting resolution bars around play button suggesting 4K quality bars -->
  <g transform="translate(955,175)">
    <rect x="-150" y="-8" width="10" height="16" fill="url(#barGrad)"/>
    <rect x="-165" y="-20" width="10" height="40" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="140" y="30" width="10" height="24" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="155" y="10" width="10" height="60" fill="url(#barGrad)" opacity="0.55"/>
  </g>

  <!-- download arrow motif -->
  <g transform="translate(955,175)">
    <path d="M0,120 L0,160 M-16,144 L0,164 L16,144" fill="none" stroke="#3ee0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- 4K badge -->
  <g transform="translate(1055,90)">
    <rect x="-38" y="-18" width="76" height="36" rx="6" fill="#0b0b0f" stroke="#ff3b3b" stroke-width="2"/>
    <text x="0" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#ff5b5b" text-anchor="middle">4K</text>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" fill="url(#titleFade)">
    <tspan x="60" y="150" textLength="700" lengthAdjust="spacingAndGlyphs">YouTube Downloader</tspan>
    <tspan x="60" y="222" font-size="60" fill="#ff5b5b" textLength="180" lengthAdjust="spacingAndGlyphs">4K</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="268" font-family="'Segoe UI', Arial, sans-serif" fill="#cfd3da" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="22.9">
    Reads YouTube URLs, processes 4K video streams, exports MP4 files — no setup
  </text>

  <!-- thin accent underline -->
  <rect x="60" y="286" width="220" height="4" fill="#ff3b3b" opacity="0.8"/>
  <rect x="290" y="286" width="60" height="4" fill="#3ee0ff" opacity="0.8"/>
</svg>